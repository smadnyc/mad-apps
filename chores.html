<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chores">
<meta name="theme-color" content="#0b0f17">
<title>Family Chores</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0b0f17; --panel: #131a26; --panel2: #1a2333; --line: #243049;
    --text: #e8edf6; --muted: #8b97ad; --accent: #4f8cff; --accent2: #2dd4a4;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  .wrap { max-width: 900px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 16px; }
  h1 { font-size: 24px; margin: 0; letter-spacing: -0.02em; }
  .date { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .stat .n { font-size: 26px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .stat.hl .n { color: var(--accent2); }
  .add-member { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] { flex: 1; min-width: 0; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 16px; outline: none; }
  input[type=text]:focus { border-color: var(--accent); }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; }
  .btn { background: var(--accent); color: #fff; padding: 12px 16px; font-weight: 600; }
  .btn.small { padding: 10px 14px; font-size: 14px; }
  .ghost { background: transparent; color: var(--muted); padding: 6px 10px; font-size: 13px; }
  .ghost:hover { color: var(--danger); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .who { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #06101f; }
  .who b { font-size: 17px; }
  .progress { font-size: 12px; color: var(--muted); }
  .chore { display: flex; align-items: center; gap: 12px; background: var(--panel2);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .chore label { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; cursor: pointer; }
  .chore input[type=checkbox] { appearance: none; -webkit-appearance: none; width: 26px; height: 26px; flex: none;
    border: 2px solid var(--line); border-radius: 8px; background: transparent; cursor: pointer; display: grid; place-items: center; }
  .chore input[type=checkbox]:checked { background: var(--accent2); border-color: var(--accent2); }
  .chore input[type=checkbox]:checked::after { content: "✓"; color: #06101f; font-weight: 800; font-size: 16px; }
  .cname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chore.done .cname { color: var(--muted); text-decoration: line-through; }
  .count { flex: none; background: #0f2a3d; color: var(--accent); border-radius: 999px;
    padding: 4px 10px; font-size: 13px; font-weight: 700; }
  .x { color: var(--muted); background: none; font-size: 18px; padding: 2px 6px; }
  .x:hover { color: var(--danger); }
  .add-chore { display: flex; gap: 8px; margin-top: 10px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 10px; }
  .setup { max-width: 480px; margin: 40px auto; background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 20px; }
  .setup p { color: var(--muted); font-size: 14px; line-height: 1.5; }
  .setup input { width: 100%; margin-bottom: 10px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--danger);
    color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; display: none; max-width: 90%; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
// ---- Supabase connection ----
// Paste your values here, OR leave blank and the app will ask for them on first open.
const SUPABASE_URL = "https://fwmcwoedvnevdulbmeax.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_QySDNGV7TuirgpNOHJRbZg_nEmzIwCk";

function cleanUrl(u) {
  u = (u || "").trim();
  if (!u) return "";
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  try { return new URL(u).origin; } catch (e) { return u; }
}
const cfg = {
  url: cleanUrl(SUPABASE_URL || localStorage.getItem("chores_sb_url") || ""),
  key: (SUPABASE_ANON_KEY || localStorage.getItem("chores_sb_key") || "").replace(/\s+/g, "")
};

const app = document.getElementById("app");
let sb = null;
let state = { members: [], chores: [], completions: [] };

const pad = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(() => t.style.display = "none", 4000);
}

function showSetup() {
  app.innerHTML = `
    <div class="setup">
      <h1>Connect Supabase</h1>
      <p>Enter your project URL and anon public key (Supabase → Project Settings → API). They're saved on this device only.</p>
      <input type="text" id="u" placeholder="https://xxxx.supabase.co" autocapitalize="off" autocorrect="off">
      <input type="text" id="k" placeholder="anon public key" autocapitalize="off" autocorrect="off">
      <button class="btn" id="save">Save &amp; connect</button>
    </div>`;
  document.getElementById("save").onclick = () => {
    const u = cleanUrl(document.getElementById("u").value);
    const k = document.getElementById("k").value.replace(/\s+/g, "");
    if (!u || !k) return;
    localStorage.setItem("chores_sb_url", u);
    localStorage.setItem("chores_sb_key", k);
    location.reload();
  };
}

async function load() {
  const [m, c, d] = await Promise.all([
    sb.from("members").select("*").order("created_at"),
    sb.from("chores").select("*").order("created_at"),
    sb.from("completions").select("chore_id, done_on")
  ]);
  const err = m.error || c.error || d.error;
  if (err) {
    toast("Load failed: " + err.message);
    if (!app.innerHTML.trim()) {
      app.innerHTML = `<div class="setup"><h1>Can't connect</h1>
        <p>${esc(err.message)}</p>
        <p>Check the URL and key, then re-enter them.</p>
        <button class="btn" id="reset">Re-enter Supabase details</button></div>`;
      document.getElementById("reset").onclick = () => {
        localStorage.removeItem("chores_sb_url");
        localStorage.removeItem("chores_sb_key");
        location.reload();
      };
    }
    return;
  }
  state = { members: m.data, chores: c.data, completions: d.data };
  render();
}

function render() {
  const today = todayStr();
  const doneToday = new Set(state.completions.filter(x => x.done_on === today).map(x => x.chore_id));
  const counts = {};
  state.completions.forEach(x => counts[x.chore_id] = (counts[x.chore_id] || 0) + 1);

  const dateLabel = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  const totalChores = state.chores.length;

  let html = `
    <header>
      <div><h1>Family Chores</h1><div class="date">${esc(dateLabel)}</div></div>
    </header>
    <div class="stats">
      <div class="stat"><div class="n">${state.members.length}</div><div class="l">Members</div></div>
      <div class="stat"><div class="n">${totalChores}</div><div class="l">Chores</div></div>
      <div class="stat hl"><div class="n">${doneToday.size}/${totalChores}</div><div class="l">Done today</div></div>
    </div>
    <form class="add-member" id="addMember">
      <input type="text" id="memberName" placeholder="Add family member" autocomplete="off" maxlength="40">
      <button class="btn" type="submit">Add</button>
    </form>`;

  if (!state.members.length) {
    html += `<div class="empty">No family members yet. Add one above to get started.</div>`;
  } else {
    html += `<div class="grid">`;
    for (const m of state.members) {
      const mine = state.chores.filter(c => c.member_id === m.id);
      const done = mine.filter(c => doneToday.has(c.id)).length;
      html += `
        <div class="card">
          <div class="card-head">
            <div class="who">
              <div class="avatar">${esc(m.name.trim().charAt(0).toUpperCase())}</div>
              <div><b>${esc(m.name)}</b><div class="progress">${done}/${mine.length} done today</div></div>
            </div>
            <button class="ghost" data-del-member="${m.id}">Remove</button>
          </div>`;
      for (const c of mine) {
        const isDone = doneToday.has(c.id);
        html += `
          <div class="chore ${isDone ? "done" : ""}">
            <label>
              <input type="checkbox" data-toggle="${c.id}" ${isDone ? "checked" : ""}>
              <span class="cname">${esc(c.name)}</span>
            </label>
            <span class="count" title="Total times completed">×${counts[c.id] || 0}</span>
            <button class="x" data-del-chore="${c.id}" aria-label="Delete chore">×</button>
          </div>`;
      }
      html += `
          <form class="add-chore" data-add-chore="${m.id}">
            <input type="text" placeholder="Add a chore" autocomplete="off" maxlength="60">
            <button class="btn small" type="submit">Add</button>
          </form>
        </div>`;
    }
    html += `</div>`;
  }
  app.innerHTML = html;
  bind();
}

function bind() {
  document.getElementById("addMember").onsubmit = async e => {
    e.preventDefault();
    const inp = document.getElementById("memberName");
    const name = inp.value.trim(); if (!name) return;
    const { error } = await sb.from("members").insert({ name });
    if (error) return toast(error.message);
    load();
  };
  document.querySelectorAll("[data-add-chore]").forEach(f => f.onsubmit = async e => {
    e.preventDefault();
    const name = f.querySelector("input").value.trim(); if (!name) return;
    const { error } = await sb.from("chores").insert({ member_id: f.dataset.addChore, name });
    if (error) return toast(error.message);
    load();
  });
  document.querySelectorAll("[data-toggle]").forEach(cb => cb.onchange = async () => {
    const id = cb.dataset.toggle, today = todayStr();
    if (cb.checked) {
      state.completions.push({ chore_id: id, done_on: today });
      render();
      const { error } = await sb.from("completions").insert({ chore_id: id, done_on: today });
      if (error && error.code !== "23505") toast(error.message);
    } else {
      state.completions = state.completions.filter(x => !(x.chore_id === id && x.done_on === today));
      render();
      const { error } = await sb.from("completions").delete().eq("chore_id", id).eq("done_on", today);
      if (error) toast(error.message);
    }
    load();
  });
  document.querySelectorAll("[data-del-chore]").forEach(b => b.onclick = async () => {
    if (!confirm("Delete this chore and its history?")) return;
    const { error } = await sb.from("chores").delete().eq("id", b.dataset.delChore);
    if (error) return toast(error.message);
    load();
  });
  document.querySelectorAll("[data-del-member]").forEach(b => b.onclick = async () => {
    if (!confirm("Remove this person and all their chores?")) return;
    const { error } = await sb.from("members").delete().eq("id", b.dataset.delMember);
    if (error) return toast(error.message);
    load();
  });
}

if (!cfg.url || !cfg.key) {
  showSetup();
} else {
  sb = supabase.createClient(cfg.url, cfg.key);
  load();
  // Keep phone and computer in sync when returning to the app
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
  setInterval(() => { if (!document.hidden) load(); }, 60000);
}
</script>
</body>
</html>
